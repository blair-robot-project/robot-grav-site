server {
    #listen 80;
    index index.html index.php;

    ## Begin - Server Info
    root /srv/robot-grav-site/;
    client_max_body_size 32M;
    # server_name localhost;
    server_name robot.mbhs.edu www.robot.mbhs.edu;
    ## End - Server Info

    ## Begin - Index
    # for subfolders, simply adjust:
    # `location /subfolder {`
    # and the rewrite to use `/subfolder/index.php`
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    ## End - Index

    ## Begin - Security
    # --- Align with Grav 2.1.8 shipped webserver-configs/nginx.conf (2026-09-19) ---
    # Deny hidden files/dirs at any depth, except ACME challenges. Grav ships this
    # as of 2.1.x. It also catches hidden dirs whose name only STARTS with a known
    # one (e.g. .git.retired-20260727), which the literal `\.git/` rule below misses.
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 403; }
    # deny all direct access for these folders
    # `tmp` required by Grav 2.1.7+; `webserver-configs` matches Grav's own .htaccess
    location ~* /(\.git|cache|bin|logs|backup|tmp|webserver-configs|tests)/.*$ { return 403; }
    # deny running scripts inside core system folders
    location ~* /(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    # deny running scripts inside user folder
    location ~* /user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }

    # --- Grav user-folder-exposure hardening (2026-06-28) ---
    # user/data = plugin runtime data. Allow only known media; deny every other extension.
    location ~* /user/data/.*\.(jpe?g|png|gif|webp|avif|bmp|svg|ico|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|pdf)$ {
        try_files $uri =404;
    }
    location ~* /user/data/.*$ { return 403; }
    # Belt-and-suspenders: fully deny credential/config/env trees regardless of extension.
    location ~* /user/(accounts|config|env)/.*$ { return 403; }
    # deny access to specific files in the root folder
    location ~ /(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }

    # --- Root CMS docs/changelog hardening (2026-07-02) ---
    # nginx ignores Grav's bundled .htaccess, so CHANGELOG.md et al. serve at the web
    # root and disclose the exact Grav version + patched-CVE list. Deny root CMS docs.
    location ~* ^/(CHANGELOG|README|SECURITY|CONTRIBUTING|LICENSE)\.(md|txt)$ { return 403; }
    ## End - Security


    ## Begin - Long-lived caching for static assets
    # Images, CSS, JS, and fonts rarely change — cache them hard client-side.
    # HTML itself is intentionally NOT cached (see Grav's system.pages.expires = 0).
    location ~* \.(jpe?g|png|gif|webp|avif|svg|ico|css|js|woff2?|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Load-bearing: Grav serves cached image derivatives through index.php, so
        # this must fall through to PHP or those images 404 (added 2026-07-30).
        try_files $uri $uri/ /index.php?$query_string;
    }
    ## End - Long-lived caching for static assets

    ## Begin - PHP
    location ~ \.php$ {
        # Choose either a socket or TCP/IP address
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        # fastcgi_pass unix:/var/run/php5-fpm.sock; #legacy
        # fastcgi_pass 127.0.0.1:9000;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
    ## End - PHP


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/robot.mbhs.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/robot.mbhs.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = robot.mbhs.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name robot.mbhs.edu www.robot.mbhs.edu;
    listen 80;
    return 404; # managed by Certbot


}
